[package]
name = "loki-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Loki core. Ring 0 (locked) and Ring 1 (versioned ports)."

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-core.workspace = true
futures-util.workspace = true
eventsource-stream.workspace = true
async-stream.workspace = true
rusqlite.workspace = true
dirs.workspace = true
serde_yaml_ng.workspace = true
jiff.workspace = true
strsim.workspace = true
git2.workspace = true
wreq = { version = "0.16.1", features = ["json", "stream"] }
wreq-util = "0.2.0"
dom_smoothie = "0.18.0"
fast_html2md = "0.0.62"

[dev-dependencies]
# `test-util` gives the paused clock the politeness tests need: a gate whose job is to wait a
# second per host is a gate no real-time test can afford to exercise honestly.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
async-stream.workspace = true
